<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubibo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: #ffffff; }
</style>
</head>
<body>

<!-- Пустая белая страница-прослойка. Задача: записать fingerprint,
     затем сразу передать управление AppsFlyer OneLink - он уже сам
     решает "открыть апку / кинуть в стор", это его сильная часть
     и ATT на нее не влияет (ATT ломает только attribution-матчинг). -->

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
// ====== НАСТРОЙКИ - ЗАМЕНИ НА СВОИ ======
const firebaseConfig = {
  apiKey: "AIzaSyDAHpO-4H4R_r4Tey9qtzT6Y5T_CSqLnHg",
  authDomain: "bubibo-ca832.firebaseapp.com",
  projectId: "bubibo-ca832",
  storageBucket: "bubibo-ca832.firebasestorage.app",
  messagingSenderId: "408251915728",
  appId: "1:408251915728:web:d5dcabe2a2f5e666c46dd5",
  measurementId: "G-1B6CQTDCFL"
};

// Ваш реальный AppsFlyer OneLink. campaign передаем дальше в query,
// чтобы потом (по click_id) можно было сматчить, на какую именно
// программу шел этот конкретный переход.
const ONELINK_BASE_URL = "https://bubibo.onelink.me/TEm4/f9qp6up0";
const CAMPAIGN_ID = new URLSearchParams(window.location.search).get('campaign') || 'program_xyz';
// ==========================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getWebGLRenderer() {
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return null;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : null;
  } catch (e) {
    return null;
  }
}

function generateClickId() {
  return 'click_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}

function collectFingerprint(clickId) {
  return {
    click_id: clickId,
    campaign_id: CAMPAIGN_ID,
    user_agent: navigator.userAgent,
    screen_resolution: screen.width + 'x' + screen.height,
    screen_scale: window.devicePixelRatio || 1,
    screen_color_depth: screen.colorDepth,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    timezone_offset: new Date().getTimezoneOffset(),
    language: navigator.language,
    languages: (navigator.languages || []).join(','),
    platform: navigator.platform || '',
    hardware_concurrency: navigator.hardwareConcurrency || null,
    device_memory: navigator.deviceMemory || null,
    webgl_renderer: getWebGLRenderer(),
    connection_type: (navigator.connection && navigator.connection.effectiveType) || null,
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
    matched: false
  };
}

function buildOnelinkUrl(clickId) {
  var url = new URL(ONELINK_BASE_URL);
  // af_dp / deep_link_value и т.п. - под ваши реальные OneLink-параметры,
  // тут просто прокидываем свой click_id и campaign, чтобы приложение
  // могло опционально прочитать их из AppsFlyer deep link data тоже
  url.searchParams.set('campaign', CAMPAIGN_ID);
  url.searchParams.set('click_id', clickId);
  return url.toString();
}

(function main() {
  var clickId = generateClickId();

  // 1) Пишем fingerprint в Firestore. Fire-and-forget - не ждем ответа,
  //    чтобы не задерживать переход в OneLink ни на миллисекунду.
  try {
    db.collection('attribution_clicks').doc(clickId)
      .set(collectFingerprint(clickId))
      .catch(function() {});
  } catch (e) {
    // Firebase не инициализировался (например конфиг не заполнен) - не блокируем редирект
  }

  // 2) Сразу передаем управление AppsFlyer OneLink - дальше решает он:
  //    апка есть -> открывает ее; апки нет -> кидает в App Store/Google Play.
  window.location.replace(buildOnelinkUrl(clickId));
})();
</script>

</body>
</html>
